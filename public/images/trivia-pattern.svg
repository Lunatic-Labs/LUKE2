<svg xmlns="http://www.w3.org/2000/svg" width="114" height="57" viewBox="0 0 114 57">
  <!-- One tile of the trivia scene's background: two columns of tilted
       question marks, the second half a row higher, so tiling staggers
       neighbouring columns. White #FFFFFF matches the other kiosk scenes; the marks are a
       lavender-grey. -->
  <rect width="114" height="57" fill="#FFFFFF"/>
  <g fill="#C4C0D6" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" text-anchor="middle">
    <text transform="translate(28 54) rotate(-15)">?</text>
    <text transform="translate(85 26) rotate(-15)">?</text>
  </g>
</svg>
