services:
  web:
    build: .
    ports:
      # Localhost only: /api/photos has no auth, so other machines on the
      # network must not be able to reach it.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # Photos taken by the camera scene; the gallery reads from here.
      - camera-pics:/app/data/camera-pics

volumes:
  camera-pics:
