services:
  web:
    build: .
    ports:
      # Localhost only: /api/photos (upload and serving) and /api/scores have
      # no auth, so other machines on the network must not be able to reach
      # them.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # Photos taken by the camera scene; /api/gallery lists them and
      # /api/photos/[name] serves them to the gallery scene.
      - camera-pics:/app/data/camera-pics
      # This machine's options (KioskId and so on). Uncomment once the file exists:
      # Docker creates a folder at a missing path, and the defaults would apply.
      # - ./data/options.txt:/app/data/options.txt:ro
      # The trivia scene's saved scores (scores.csv); /api/scores reads and
      # appends to it.
      - trivia-scores:/app/data/trivia-scores

volumes:
  camera-pics:
  trivia-scores:
